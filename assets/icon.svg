<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Prom King</title>
  <!-- A king's crown whose points are the peaks of a metric's line, the tallest in the middle:
       one bold shape, outlined dark so it holds on a light background, bright enough for a dark one.
       Prom Queen's sibling, in gold where hers is coral. -->
  <g stroke="#4a3208" stroke-width="3" stroke-linejoin="round">
    <path d="M8 46 V21 L17 32 L24 15 L32 26 L40 9 L47 25 L56 17 V46 Z" fill="#f2b632"/>
    <rect x="6" y="44" width="52" height="10" rx="3" fill="#cf8a10"/>
    <circle cx="24" cy="15" r="3.5" fill="#7fb2ff"/>
    <circle cx="40" cy="9" r="4" fill="#7fb2ff"/>
    <circle cx="56" cy="17" r="3.5" fill="#7fb2ff"/>
  </g>
</svg>
